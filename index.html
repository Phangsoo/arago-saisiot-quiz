const labels=['고유어 + 고유어','고유어 + 한자어','한자어 + 고유어','한자어 + 한자어'];
const ids=['①','②','③','④'];
const $=id=>document.getElementById(id);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let round=[],pointer=0,mode='전체 학습',answers={},previousBad=new Set();
function start(modeName='전체 학습',chosen=null){mode=modeName;round=shuffle(chosen||BANK.map(q=>q.id)).map(id=>({id,choices:[1,2,3,4]}));pointer=0;answers={};render();}
function current(){return BANK.find(q=>q.id===round[pointer].id)}
function counts(){const values=Object.values(answers).filter(x=>x.graded);return [values.filter(x=>x.correct).length,values.filter(x=>!x.correct).length]}
function render(){
 $('mode').textContent=mode;
 if(pointer>=round.length){renderSummary();return}
 const q=current(),state=answers[q.id]||{},[good,bad]=counts();
 $('bar').style.width=(pointer/round.length*100)+'%';$('progress').textContent=`${pointer+1} / ${round.length}`;$('scores').textContent=`정답 ${good} · 오답 ${bad}`;
 const choiceNodes=round[pointer].choices.map(k=>{let c='option';if(state.selected===k)c+=' selected';if(state.graded&&k===q.category)c+=' correct';if(state.graded&&state.selected===k&&!state.correct)c+=' wrong';return `<button class="${c}" data-choice="${k}" type="button" ${state.graded?'disabled':''}>${escapeHtml(labels[k-1])}</button>`}).join('');
 $('card').innerHTML=`<div class="card-top"><span>문제 ${pointer+1}</span><button id="back" type="button" class="back" ${pointer===0?'disabled':''}>← 이전 문제</button></div><h2>다음 단어는 아래 분류 중에서 어떤 것에 해당하는가?</h2><div class="word">${escapeHtml(q.word)}</div><div class="options">${choiceNodes}</div>${state.graded?`<div class="feedback ${state.correct?'good':'bad'}"><div class="result">${state.correct?'정답입니다!':'아쉽지만 오답입니다.'}</div><p><strong>정답: ${escapeHtml(labels[q.category-1])}</strong></p><p>표준 표기: <strong>${escapeHtml(q.form)}</strong></p><p>${escapeHtml(q.explanation)}</p></div>`:''}<div class="actions">${!state.graded?'<button type="button" id="check" class="primary" '+(!state.selected?'disabled':'')+'>정답 확인</button>':'<button type="button" id="next" class="primary">'+(pointer===round.length-1?'결과 보기':'다음 문제 →')+'</button>'}</div>`;
 $('back').onclick=()=>{if(pointer>0){pointer--;render()}};
 if(!state.graded){$('card').querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{answers[q.id]={...state,selected:Number(btn.dataset.choice)};render()});$('check').onclick=()=>{let a=answers[q.id];if(!a?.selected)return;answers[q.id]={...a,graded:true,correct:a.selected===q.category};render()}}else $('next').onclick=()=>{pointer++;render()};
}
function renderSummary(){const [good,bad]=counts();const wrong=round.filter(x=>answers[x.id]&&!answers[x.id].correct).map(x=>x.id);previousBad=new Set(wrong);$('bar').style.width='100%';$('progress').textContent=`${round.length}문항 학습 완료`;$('scores').textContent=`정답 ${good} · 오답 ${bad}`;$('card').innerHTML=`<div class="summary"><h2>${bad===0?'모두 맞혔어요!':'이번 학습을 마쳤어요'}</h2><div class="big">${good} / ${round.length}</div><p>정답 ${good}개 · 오답 ${bad}개<br>틀린 문제만 다시 풀거나 전체 문제를 새 순서로 풀 수 있어요.</p><div class="actions">${wrong.length?`<button class="primary" id="retry">틀린 문제 다시 풀기 (${wrong.length})</button>`:''}<button class="secondary" id="restart">전체 다시 풀기</button></div></div>`;const retry=$('retry');if(retry)retry.onclick=()=>start('오답 다시 풀기',wrong);$('restart').onclick=()=>start();}
start();
</script></body></html>
